<!DOCTYPE html>
<html>

<head>
    <title>
        2D Game By PDB

    </title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body onkeyup="key(event);" class="body" id="body">
<div class="home-page">
    
    <div id="home">
        <div class="welcome">Welcome To 2D Animation Game</div>
        <div class="play-box">
            <img width="300" src="1/Idle (1).png"/>
         
         <img src="play-btn.png" onclick="start()" width="300" id="play" class="Play"/>
             <div class="H-text-2">
              <h3 onclick="toplay()" id="H-play" class="H-play">How to play</h3>
              <h3 id="About" class="H-play">About us</h3>
            </div>
        
        </div>


    </div>
</div>

    <div class="start" id="start">
        <div class="welcome">Welcome To 2D Animation Game</div>
        <div  class="intro"><span class="intro-head">Game Controls</span>
            </br>
            <div class="H-text"></br>Press "ENTER" To run.
            </br>Press"SPACE" to jump.
            </br>Press "SHIFT" to pause.
            </br>Press "CTRL" to slide.
            </div>
        
        </div>
            <div class="charact">
            <p class="select-char">Your Character</p>
            <img onclick="man();" class="char01" id="char01" src="1/Idle (1).png" />
        </div>
        <button onclick="start();" class="btn-01"></button>
    </div>
    <div class="background" id="background">
        <p id="score" class="score">0</p>
        <img id="boy" class="boy" src="1/Idle (1).png" />
    </div>
    <div class="end" id="end">
        <div class="gameover">Game Over</div></br>
        <div class="yourscore">Your Score</div>
        <div class="endscore" id="endscore">0</div>
        </br> <button onclick="reload();" class="btn"><img width="300" src="play-btn.png"/></button>

    </div>
    <div id="end-box" class="end-box">
        <p>You Won</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
